name: YYC Car Search - Every 6 Hours

on:
  schedule:
    - cron: '45 */6 * * *'   # every 6 hours (offset from the other bots)
  workflow_dispatch:          # Manual trigger from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write          # Needed to commit the tracker file back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Calgary used-car scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_CARS: ${{ secrets.TELEGRAM_CHAT_ID_CARS }}
          # Managed scraper — set ANY ONE (all have free tiers). Auto-selected:
          # ScrapingBee > Scrape.do > ScraperAPI > CAR_PROXY > direct.
          # Force one with SCRAPER_PROVIDER (e.g. 'scrapedo') if another runs out.
          SCRAPER_PROVIDER: ${{ secrets.SCRAPER_PROVIDER }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPEDO_TOKEN: ${{ secrets.SCRAPEDO_TOKEN }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          CAR_PROXY: ${{ secrets.CAR_PROXY }}
          # Sources
          KIJIJI_ENABLED: '1'
          # Filters
          CAR_MAX_PRICE: '18000'
          CAR_MAX_KM: '180000'
          CAR_MAX_AGE_YEARS: '20'
          CAR_MIN_SCORE: '7'
          CAR_SEED_SILENT: '1'      # first run seeds silently, then only new deals
          # Facebook Marketplace (experimental — usually needs a logged-in cookie)
          FB_MARKETPLACE_ENABLED: ${{ secrets.FB_MARKETPLACE_ENABLED }}
          FB_COOKIE: ${{ secrets.FB_COOKIE }}
        run: |
          python car_alert.py

      - name: Commit updated car tracker
        continue-on-error: true
        run: |
          git config --local user.email "car-bot@github-actions"
          git config --local user.name "YYC Car Bot"
          git add car-tracker-seen.md
          git diff --staged --quiet || git commit -m "chore: update car tracker [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push
